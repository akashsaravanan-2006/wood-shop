<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Labour Charges</title>

    <link
        rel="stylesheet"
        href="../css/labour.css?v=200">

</head>


<body>

<div class="container">

    <!-- =========================================
         TITLE
    ========================================== -->

    <h1>
        Labour & Other Charges
    </h1>


    <!-- =========================================
         WOOD TOTAL
    ========================================== -->

    <div class="field">

        <label>
            Wood Total
        </label>

        <div class="displayBox">

            <span id="woodTotal">
                ₹ 0.00
            </span>

        </div>

    </div>


    <!-- =========================================
         LABOUR CHARGE
    ========================================== -->

    <div class="field">

        <label for="labourCharge">
            Labour Charge
        </label>

        <input
            type="number"
            id="labourCharge"
            min="0"
            step="0.01"
            placeholder="Enter Labour Charge"
            autocomplete="off">

    </div>


    <!-- =========================================
         OTHER CHARGE
    ========================================== -->

    <div class="field">

        <label for="otherCharge">
            Other Charge
        </label>

        <input
            type="number"
            id="otherCharge"
            min="0"
            step="0.01"
            placeholder="Enter Other Charge"
            autocomplete="off">

    </div>


    <!-- =========================================
         ADD OTHER BUTTON
    ========================================== -->

    <button
        type="button"
        id="addOtherBtn">

        + Add Other

    </button>


    <!-- =========================================
         ADDITIONAL OTHER CHARGES
    ========================================== -->

    <div id="othersContainer"></div>


    <!-- =========================================
         OTHERS TOTAL
    ========================================== -->

    <div class="totalSection">

        <label>
            Others Total
        </label>

        <div
            id="othersTotal"
            class="displayBox">

            ₹ 0.00

        </div>

    </div>


    <!-- =========================================
         GRAND TOTAL
    ========================================== -->

    <div class="totalSection">

        <label>
            Grand Total
        </label>

        <div
            id="grandTotal"
            class="displayBox grandTotal">

            ₹ 0.00

        </div>

    </div>


    <!-- =========================================
         BUTTONS
    ========================================== -->

    <div class="buttons">

        <button
            type="button"
            id="confirmBtn"
            class="confirmBtn">

            Confirm

        </button>


        <button
            type="button"
            id="backBtn"
            class="backBtn">

            Back

        </button>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="../js/storedata.js?v=200"></script>

<script src="../js/labour.js?v=200"></script>


</body>

</html>
