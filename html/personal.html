<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Customer Information</title>

    <link
        rel="stylesheet"
        href="../css/personal.css?v=10001">

</head>


<body>

<div class="container">

    <!-- =========================================
         TITLE
    ========================================== -->

    <h1>
        Customer Information
    </h1>


    <!-- =========================================
         CUSTOMER NAME
    ========================================== -->

    <div class="inputBox">

        <label for="customerName">
            Customer Name
        </label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter Customer Name"
            autocomplete="off">

    </div>


    <!-- =========================================
         MOBILE NUMBER
    ========================================== -->

    <div class="inputBox">

        <label for="mobileNumber">
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobileNumber"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter Mobile Number"
            autocomplete="off">

    </div>


    <!-- =========================================
         PLACE
    ========================================== -->

    <div class="inputBox">

        <label for="place">
            Place
        </label>

        <input
            type="text"
            id="place"
            placeholder="Enter Place"
            autocomplete="off">

    </div>


    <!-- =========================================
         NEXT BUTTON
         PERSONAL -> DISCOUNT
    ========================================== -->

    <button
        type="button"
        id="nextBtn">

        Next

    </button>


    <!-- =========================================
         BACK BUTTON
         PERSONAL -> LABOUR
    ========================================== -->

    <div class="button-container">

        <button
            type="button"
            id="backBtn">

            Back

        </button>

    </div>

</div>


<!-- =================================================
     PERSONAL JAVASCRIPT

     PERSONAL -> DISCOUNT
     BACK -> LABOUR
================================================== -->


 <script src="../js/storedata.js?v=102"></script>
<script src="../js/personal.js?v=102"></script>
<script src="../js/inputControl.js?v=102"></script>


</body>

</html>
