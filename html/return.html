<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Return Bill</title>

    <link
        rel="stylesheet"
        href="../css/return.css">

</head>

<body>

    <div class="container">

        <!-- ==============================
             PAGE HEADER
        =============================== -->

        <div class="pageHeader">

            <div>
                <h1>↩ Return Bill</h1>

                <p>
                    Return amount and bill details
                </p>
            </div>

            <button
                type="button"
                id="backBtn">

                ← Back

            </button>

        </div>


        <!-- ==============================
             BILL DETAILS
        =============================== -->

        <div class="billCard">

            <h2>📄 Bill Details</h2>

            <div class="detailsGrid">

                <div class="detailBox">
                    <span>Bill No</span>
                    <strong id="billNo">-</strong>
                </div>

                <div class="detailBox">
                    <span>Customer ID</span>
                    <strong id="customerId">-</strong>
                </div>

                <div class="detailBox">
                    <span>Customer Name</span>
                    <strong id="customerName">-</strong>
                </div>

                <div class="detailBox">
                    <span>Mobile</span>
                    <strong id="mobile">-</strong>
                </div>

                <div class="detailBox">
                    <span>Place</span>
                    <strong id="place">-</strong>
                </div>

                <div class="detailBox">
                    <span>Bill Date</span>
                    <strong id="billDate">-</strong>
                </div>

                <div class="detailBox">
                    <span>Grand Total</span>
                    <strong id="grandTotal">₹ 0.00</strong>
                </div>

                <div class="detailBox">
                    <span>Advance Amount</span>
                    <strong
                        class="advance"
                        id="advanceAmount">

                        ₹ 0.00

                    </strong>
                </div>

                <div class="detailBox">
                    <span>Balance Amount</span>
                    <strong
                        class="balance"
                        id="balanceAmount">

                        ₹ 0.00

                    </strong>
                </div>

                <div class="detailBox">
                    <span>Previous Return</span>
                    <strong
                        class="returnAmount"
                        id="previousReturn">

                        ₹ 0.00

                    </strong>
                </div>

            </div>

        </div>


        <!-- ==============================
             RETURN SECTION
        =============================== -->

        <div class="returnCard">

            <h2>↩ Return Details</h2>

            <div class="returnForm">

                <label for="returnAmount">
                    Return Amount
                </label>

                <input
                    type="number"
                    id="returnAmount"
                    min="0"
                    step="0.01"
                    placeholder="Enter return amount">

                <small>
                    Enter the amount to be returned to the customer.
                </small>

            </div>


            <div class="buttonArea">

                <button
                    type="button"
                    id="saveReturnBtn">

                    ↩ Save Return

                </button>

                <button
                    type="button"
                    id="cancelBtn">

                    ✕ Cancel

                </button>

            </div>

        </div>


        <!-- ==============================
             MESSAGE
        =============================== -->

        <div
            id="message"
            class="message">
        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="../js/return.js"></script>

</body>

</html>
