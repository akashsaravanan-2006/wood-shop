<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Labour Charges</title>

    <link
        rel="stylesheet"
        href="../css/labour.css">

</head>


<body>

<div class="container">

    <h1>
        Labour & Other Charges
    </h1>


    <!-- =========================================
         WOOD TOTAL
    ========================================== -->

    <div class="inputBox">

        <label>
            Wood Total
        </label>

        <div class="amountBox">

            <span>
                ₹
            </span>

            <strong id="woodTotal">
                0.00
            </strong>

        </div>

    </div>


    <!-- =========================================
         LABOUR CHARGE
    ========================================== -->

    <div class="inputBox">

        <label for="labourCharge">
            Labour Charge
        </label>

        <input
            type="number"
            id="labourCharge"
            min="0"
            step="0.01"
            value="0"
            placeholder="Enter Labour Charge">

    </div>


    <!-- =========================================
         OTHER CHARGE
    ========================================== -->

    <div class="inputBox">

        <label for="otherCharge">
            Other Charge
        </label>

        <input
            type="number"
            id="otherCharge"
            min="0"
            step="0.01"
            value="0"
            placeholder="Enter Other Charge">

    </div>


    <!-- =========================================
         ADD OTHER
    ========================================== -->

    <button
        type="button"
        id="addOtherBtn">

        + Add Other

    </button>


    <!-- =========================================
         ADDITIONAL OTHER CHARGES
    ========================================== -->

    <div id="othersContainer"></div>


    <!-- =========================================
         OTHERS TOTAL
    ========================================== -->

    <div class="totalBox">

        <span>
            Others Total
        </span>

        <strong id="othersTotal">
            ₹ 0.00
        </strong>

    </div>


    <!-- =========================================
         GRAND TOTAL
    ========================================== -->

    <div class="totalBox grandBox">

        <span>
            Grand Total
        </span>

        <strong id="grandTotal">
            ₹ 0.00
        </strong>

    </div>


    <!-- =========================================
         BUTTONS
    ========================================== -->

    <div class="buttonContainer">

        <button
            type="button"
            id="confirmBtn">

            Confirm

        </button>


        <button
            type="button"
            id="backBtn">

            Back

        </button>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="../js/storedata.js?v=100"></script>

<script src="../js/labour.js?v=100"></script>

<script src="../js/inputControl.js?v=100"></script>


</body>

</html>
