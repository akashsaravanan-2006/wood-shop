<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Advance Payment</title>

    <link rel="stylesheet"
          href="../css/advance.css">

</head>


<body>


<div class="container">


    <div class="card">


        <!-- =========================
             TITLE
        ========================== -->

        <h1>
            Advance Payment
        </h1>


        <hr>


        <!-- =========================
             GRAND TOTAL
        ========================== -->

        <div class="row">

            <label>
                Grand Total
            </label>

            <input
                type="text"
                id="grandTotal"
                class="totalDisplay"
                readonly>

        </div>


        <!-- =========================
             DISCOUNT
        ========================== -->

        <div class="row">

            <label>
                Discount Amount
                <span style="
                    font-size:12px;
                    font-weight:400;
                    color:#888;
                ">
                    (Optional)
                </span>
            </label>

            <input
                type="number"
                id="discountAmount"
                min="0"
                step="1"
                placeholder="Enter Discount Amount">

        </div>


        <!-- =========================
             PAYMENT TYPE
        ========================== -->

        <div class="row">

            <label>
                Payment Type
            </label>


            <div class="paymentType">


                <!-- CASH -->

                <label class="radioLabel">

                    <input
                        type="radio"
                        name="paymentType"
                        value="cash"
                        checked>

                    Cash

                </label>


                <!-- UPI -->

                <label class="radioLabel">

                    <input
                        type="radio"
                        name="paymentType"
                        value="upi">

                    UPI

                </label>


                <!-- ADVANCE -->

                <label class="radioLabel">

                    <input
                        type="radio"
                        name="paymentType"
                        value="advance">

                    Advance

                </label>


            </div>

        </div>


        <!-- =========================
             ADVANCE SECTION
        ========================== -->

        <div id="advanceSection">


            <!-- =========================
                 ADVANCE AMOUNT
            ========================== -->

            <div class="row">

                <label>
                    Advance Amount
                </label>

                <input
                    type="number"
                    id="advanceAmount"
                    min="0"
                    step="1"
                    placeholder="Enter Advance Amount">

            </div>


            <!-- =========================
                 BALANCE AMOUNT
            ========================== -->

            <div class="row">

                <label>
                    Balance Amount
                </label>

                <input
                    type="text"
                    id="balanceAmount"
                    readonly>

            </div>


            <!-- =========================
                 CALCULATE
            ========================== -->

            <div class="buttonRow">

                <button
                    type="button"
                    id="calculateBtn">

                    Calculate

                </button>

            </div>


        </div>


        <!-- =========================
             NEXT BUTTON
        ========================== -->

        <div class="buttonRow">

            <button
                type="button"
                id="nextBtn">

                Next

            </button>

        </div>


        <!-- =========================
             BACK BUTTON
        ========================== -->

        <div class="button-container">

            <button
                type="button"
                id="backBtn">

                Back

            </button>

        </div>


    </div>


</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="../js/advance.js"></script>

<script src="../js/inputControl.js"></script>


</body>

</html>
