<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Labour & Other Charges</title>

    <link
        rel="stylesheet"
        href="../css/labour.css?v=100">

</head>


<body>

<div class="container">

    <div class="card">

        <!-- =========================================
             TITLE
        ========================================== -->

        <h1>
            Labour & Other Charges
        </h1>


        <!-- =========================================
             WOOD TOTAL
        ========================================== -->

        <div class="row">

            <label>
                Wood Total
            </label>

            <div
                id="woodTotal"
                class="amount-box">

                ₹ 0.00

            </div>

        </div>


        <!-- =========================================
             LABOUR CHARGE
        ========================================== -->

        <div class="row">

            <label for="labourCharge">
                Labour Charge
            </label>

            <input
                type="number"
                id="labourCharge"
                min="0"
                step="0.01"
                placeholder="Enter Labour Charge"
                autocomplete="off">

        </div>


        <!-- =========================================
             OTHER CHARGE
        ========================================== -->

        <div class="row">

            <label for="otherCharge">
                Other Charge
            </label>

            <input
                type="number"
                id="otherCharge"
                min="0"
                step="0.01"
                placeholder="Enter Other Charge"
                autocomplete="off">

        </div>


        <!-- =========================================
             ADD OTHER
        ========================================== -->

        <button
            type="button"
            id="addOtherBtn"
            class="add-other-btn">

            + Add Other

        </button>


        <!-- =========================================
             ADDITIONAL OTHER ITEMS
        ========================================== -->

        <div
            id="othersContainer"
            class="others-container">

        </div>


        <!-- =========================================
             OTHERS TOTAL
        ========================================== -->

        <div class="row total-row">

            <label>
                Others Total
            </label>

            <div
                id="othersTotal"
                class="amount-box">

                ₹ 0.00

            </div>

        </div>


        <!-- =========================================
             GRAND TOTAL
        ========================================== -->

        <div class="row total-row">

            <label>
                Grand Total
            </label>

            <div
                id="grandTotal"
                class="amount-box grand-total">

                ₹ 0.00

            </div>

        </div>


        <!-- =========================================
             BUTTONS
        ========================================== -->

        <div class="button-container">

            <button
                type="button"
                id="confirmBtn"
                class="confirm-btn">

                Confirm

            </button>


            <button
                type="button"
                id="backBtn"
                class="back-btn">

                Back

            </button>


            <button
                type="button"
                id="nextBtn"
                class="next-btn">

                Next

            </button>

        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="../js/labour.js?v=100"></script>


</body>

</html>
