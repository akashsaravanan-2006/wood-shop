<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Amman Saw Mill | Wood Shop</title>

    <link
        rel="stylesheet"
        href="../css/style.css?v=10">

</head>


<body>

    <!-- =========================================
         BACKGROUND OVERLAY
    ========================================== -->

    <div class="page-overlay"></div>


    <!-- =========================================
         MAIN CONTAINER
    ========================================== -->

    <div class="container">

        <!-- SHOP HEADER -->

        <div class="shop-header">

            <div class="shop-icon">
                🪵
            </div>

            <h1>
                ஸ்ரீ அம்மன் சாமில்
            </h1>

            <p class="business-type">
                தேக்கு, வேம்பு, பூவரசு வியாபாரம்
            </p>

            <div class="header-line"></div>

            <p class="mobile">
                <span>📞</span>
                Mobile : 9443076409 , 9715050908
            </p>

            <p class="gst">
                <span>GST</span> : 33DLKPK5760D1Z5
            </p>

        </div>


        <!-- =========================================
             MENU BUTTONS
        ========================================== -->

        <div class="menu-section">

            <button
                type="button"
                id="woodBtn"
                class="menu-btn wood-btn">

                <span class="btn-icon">🪵</span>

                <span class="btn-content">
                    <strong>Wood Calculation</strong>
                    <small>Calculate wood quantity and amount</small>
                </span>

                <span class="arrow">→</span>

            </button>


            <button
                type="button"
                id="pendingBtn"
                class="menu-btn pending-btn">

                <span class="btn-icon">⏳</span>

                <span class="btn-content">
                    <strong>Pending Bill</strong>
                    <small>View pending customer bills</small>
                </span>

                <span class="arrow">→</span>

            </button>


            <button
                type="button"
                id="historyBtn"
                class="menu-btn history-btn">

                <span class="btn-icon">📋</span>

                <span class="btn-content">
                    <strong>History</strong>
                    <small>View all previous bills</small>
                </span>

                <span class="arrow">→</span>

            </button>


            <button
                type="button"
                id="clearBtn"
                class="menu-btn clear-btn">

                <span class="btn-icon">🗑️</span>

                <span class="btn-content">
                    <strong>Clear</strong>
                    <small>Clear current calculation</small>
                </span>

                <span class="arrow">→</span>

            </button>

        </div>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <div class="footer">

            <span>AMMAN SAW MILL</span>

            <span class="footer-dot">•</span>

            <span>Quality Wood &amp; Service</span>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
         
         IMPORTANT ORDER:
         1. storedata.js
         2. script.js
         3. inputControl.js
    ========================================== -->

    <script src="../js/storedata.js?v=10"></script>

    <script src="../js/script.js?v=10"></script>

    <script src="../js/inputControl.js?v=10"></script>

</body>

</html>
