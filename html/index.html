<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Amman Saw Mill</title>

    <link
        rel="stylesheet"
        href="../css/style.css?v=3">
</head>

<body>

    <div class="home-overlay">

        <div class="container home-container">

            <!-- SHOP HEADER -->
            <div class="shop-header">

                <h1>ஸ்ரீ அம்மன் சாமில்</h1>

                <h2>
                    தேக்கு, வேம்பு, பூவரசு வியாபாரம்
                </h2>

                <div class="contact-info">
                    <p>
                        Mobile : 9443076409 , 9715050908
                    </p>

                    <p>
                        GST : 33DLKPK5760D1Z5
                    </p>
                </div>

            </div>


            <!-- MENU BUTTONS -->
            <div class="home-menu">

                <button
                    type="button"
                    id="woodBtn"
                    class="menu-btn">

                    <span class="btn-title">
                        Wood Calculation
                    </span>

                    <span class="btn-description">
                        Calculate wood quantity and amount
                    </span>

                </button>


                <button
                    type="button"
                    id="pendingBtn"
                    class="menu-btn">

                    <span class="btn-title">
                        Pending Bill
                    </span>

                    <span class="btn-description">
                        View pending customer bills
                    </span>

                </button>


                <button
                    type="button"
                    id="historyBtn"
                    class="menu-btn">

                    <span class="btn-title">
                        History
                    </span>

                    <span class="btn-description">
                        View all previous bills
                    </span>

                </button>


                <button
                    type="button"
                    id="clearBtn"
                    class="menu-btn clear-menu-btn">

                    <span class="btn-title">
                        Clear
                    </span>

                    <span class="btn-description">
                        Clear current calculation
                    </span>

                </button>

            </div>


            <!-- FOOTER -->
            <div class="home-footer">

                <p>
                    AMMAN SAW MILL
                </p>

                <span>
                    Quality Wood &amp; Service
                </span>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../js/storedata.js?v=3"></script>

    <script src="../js/script.js?v=3"></script>

    <script src="../js/inputControl.js?v=3"></script>
