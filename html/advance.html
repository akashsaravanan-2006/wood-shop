<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advance Payment</title>

    <link rel="stylesheet" href="../css/advance.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Advance Payment</h1>

        <hr>


        <!-- =========================================
             GRAND TOTAL
        ========================================== -->

        <div class="row">

            <label>Grand Total</label>

            <input
                type="text"
                id="grandTotal"
                readonly
            >

        </div>


        <!-- =========================================
             DISCOUNT
        ========================================== -->

        <div class="row">

            <label>
                Discount Amount
                <span class="optional">(Optional)</span>
            </label>

            <input
                type="number"
                id="discountAmount"
                min="0"
                step="1"
                placeholder="Enter Discount Amount"
            >

        </div>


        <!-- =========================================
             FINAL GRAND TOTAL
        ========================================== -->

        <div class="row">

            <label>Final Grand Total</label>

            <input
                type="text"
                id="finalGrandTotal"
                readonly
            >

        </div>


        <!-- =========================================
             PAYMENT TYPE
        ========================================== -->

        <div class="payment-section">

            <div class="section-title">

                <h3>Payment Type</h3>

                <p>Choose payment type</p>

            </div>


            <div class="payment-cards">

                <!-- READY CASH -->

                <label class="payment-card">

                    <input
                        type="radio"
                        name="paymentType"
                        value="cash"
                        checked
                    >

                    <div class="card-content">

                        <div class="payment-icon cash-icon">
                            ₹
                        </div>

                        <div class="payment-info">

                            <strong>Ready Cash</strong>

                            <span>Full payment now</span>

                        </div>

                        <div class="check-mark">
                            ✓
                        </div>

                    </div>

                </label>


                <!-- ADVANCE -->

                <label class="payment-card">

                    <input
                        type="radio"
                        name="paymentType"
                        value="advance"
                    >

                    <div class="card-content">

                        <div class="payment-icon advance-icon">
                            %
                        </div>

                        <div class="payment-info">

                            <strong>Advance</strong>

                            <span>Pay partially now</span>

                        </div>

                        <div class="check-mark">
                            ✓
                        </div>

                    </div>

                </label>

            </div>

        </div>


        <!-- =========================================
             PAYMENT MODE
        ========================================== -->

        <div class="payment-section">

            <div class="section-title">

                <h3>Payment Mode</h3>

                <p>Select payment method</p>

            </div>


            <div class="mode-cards">

                <!-- CASH -->

                <label class="mode-card">

                    <input
                        type="radio"
                        name="paymentMode"
                        value="cash"
                        checked
                    >

                    <div class="mode-content">

                        <div class="mode-icon cash-mode">
                            💵
                        </div>

                        <div class="mode-info">

                            <strong>Cash</strong>

                            <span>Physical payment</span>

                        </div>

                        <div class="mode-check">
                            ✓
                        </div>

                    </div>

                </label>


                <!-- UPI -->

                <label class="mode-card">

                    <input
                        type="radio"
                        name="paymentMode"
                        value="upi"
                    >

                    <div class="mode-content">

                        <div class="mode-icon upi-mode">
                            UPI
                        </div>

                        <div class="mode-info">

                            <strong>UPI</strong>

                            <span>Digital payment</span>

                        </div>

                        <div class="mode-check">
                            ✓
                        </div>

                    </div>

                </label>

            </div>

        </div>


        <!-- =========================================
             ADVANCE SECTION
             ONLY SHOW WHEN ADVANCE SELECTED
        ========================================== -->

        <div id="advanceSection">

            <div class="row">

                <label>Advance Amount</label>

                <input
                    type="number"
                    id="advanceAmount"
                    min="0"
                    step="1"
                    placeholder="Enter Advance Amount"
                >

            </div>


            <div class="row">

                <label>Balance Amount</label>

                <input
                    type="text"
                    id="balanceAmount"
                    readonly
                >

            </div>


            <div class="buttonRow">

                <button
                    type="button"
                    id="calculateBtn"
                >
                    Calculate Balance
                </button>

            </div>

        </div>


        <!-- =========================================
             NEXT
        ========================================== -->

        <div class="buttonRow">

            <button
                type="button"
                id="nextBtn"
            >
                Next
            </button>

        </div>


        <!-- =========================================
             BACK
        ========================================== -->

        <div class="button-container">

            <button
                type="button"
                id="backBtn"
            >
                Back
            </button>

        </div>

    </div>

</div>


<script src="../js/advance.js"></script>

<script src="../js/inputControl.js"></script>

</body>

</html>
