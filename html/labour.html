<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Labour & Other Charges</title>

    <link
        rel="stylesheet"
        href="../css/labour.css">

</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            Labour & Other Charges
        </h1>


        <!-- WOOD TOTAL -->

        <div class="field">

            <label>
                Wood Total
            </label>

            <div class="amount-box">

                <strong id="woodTotal">
                    ₹ 0.00
                </strong>

            </div>

        </div>


        <!-- LABOUR -->

        <div class="field">

            <label for="labourCharge">
                Labour Charge
            </label>

            <input
                type="number"
                id="labourCharge"
                min="0"
                step="0.01"
                placeholder="Enter Labour Charge">

        </div>


        <!-- OTHER -->

        <div class="field">

            <label for="otherCharge">
                Other Charge
            </label>

            <input
                type="number"
                id="otherCharge"
                min="0"
                step="0.01"
                placeholder="Enter Other Charge">

        </div>


        <!-- ADD OTHER -->

        <div class="button-row">

            <button
                type="button"
                id="addOtherBtn">

                + Add Other

            </button>

        </div>


        <!-- ADDITIONAL OTHER ITEMS -->

        <div id="othersContainer"></div>


        <!-- OTHERS TOTAL -->

        <div class="field">

            <label>
                Others Total
            </label>

            <div class="amount-box">

                <strong id="othersTotal">
                    ₹ 0.00
                </strong>

            </div>

        </div>


        <!-- GRAND TOTAL -->

        <div class="field">

            <label>
                Grand Total
            </label>

            <div class="grand-total-box">

                <strong id="grandTotal">
                    ₹ 0.00
                </strong>

            </div>

        </div>


        <!-- BUTTONS -->

        <div class="bottom-buttons">

            <button
                type="button"
                id="confirmBtn">

                Confirm

            </button>


            <button
                type="button"
                id="backBtn">

                Back

            </button>

        </div>


        <!-- NEXT -->

        <div class="next-row">

            <button
                type="button"
                id="nextBtn">

                Next

            </button>

        </div>

    </div>

</div>


<!-- ONLY LABOUR JS -->

<script src="../js/labour.js?v=500"></script>


</body>

</html>
